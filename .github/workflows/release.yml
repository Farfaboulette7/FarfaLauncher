# Publication d'une version : à chaque tag vX.Y.Z, lance d'abord les tests (tests.yml, Windows
# et Linux), puis compile Windows, Linux (AppImage) et Mac Apple Silicon (.dmg), signe les
# paquets de mise à jour et publie une GitHub Release avec latest.json (lu par le module de
# mise à jour). Si un test échoue, rien n'est créé ni publié : corriger, puis repousser le tag.
#
# Deux canaux :
#   - stable (tag vX.Y.Z) : release normale, la « dernière release » de GitHub, lue par tous
#     les launchers (releases/latest/download/latest.json) ;
#   - bêta (tag vX.Y.Z-beta.N) : pré-release, que GitHub ne donne jamais comme dernière : les
#     launchers du canal stable ne la voient pas.
# À chaque publication, bêta ou stable, son latest.json remplace celui de la release technique
# « canal-beta », lu par les launchers qui ont coché « Recevoir les versions de test ».
#
# Ordre : tests (sans clé) → release en brouillon + moteur du Deck (sans clé) → ATTENTE de
# l'approbation du propriétaire (environnement « signature ») → compilation signée →
# publication. Tant qu'il n'a pas approuvé, le run reste en statut « waiting » et rien n'est
# publié. S'il refuse (« Reject »), le run échoue et le brouillon reste invisible des joueurs.
#
# Secrets requis, dans l'environnement « signature » (Settings → Environments → signature →
# Environment secrets), PAS dans les secrets du dépôt :
#   TAURI_SIGNING_PRIVATE_KEY           contenu du fichier farfalauncher.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  mot de passe choisi à la génération
name: Release

on:
  push:
    tags: ["v*.*.*"]

# Par défaut, lecture seule ; seuls les jobs qui créent ou remplissent la release ont le droit
# d'écrire (contents: write), job par job.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Tests d'abord : tous les autres jobs en dépendent (needs), directement ou non.
  tests:
    uses: ./.github/workflows/tests.yml

  create-release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le tag correspond à la version du projet
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$TAG tauri.conf=$CONF package.json=$PKG Cargo.toml=$CARGO"
          if [ "$TAG" != "$CONF" ] || [ "$TAG" != "$PKG" ] || [ "$TAG" != "$CARGO" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas aux versions des fichiers (utilisez scripts/bump-version.mjs)."
            exit 1
          fi

      - name: Créer la release (brouillon)
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            // Notes de version : docs/changelog/<tag>.md s'il existe (affichées
            // aussi par le module de mise à jour).
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const notes = `docs/changelog/${tag}.md`;
            const body = fs.existsSync(notes)
              ? fs.readFileSync(notes, 'utf8')
              : 'Téléchargez le fichier correspondant à votre système ci-dessous. Si FaRFa project est déjà installé, il se met à jour tout seul.';
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `FaRFa project ${tag}`,
              body,
              draft: true,
              // vX.Y.Z-beta.N : version de test, seulement pour le canal bêta.
              prerelease: tag.includes('-'),
            });
            return data.id;

  # Compilation et signature : SEUL job de ce workflow qui reçoit la clé de signature.
  #
  # Approbation obligatoire (faille SG3) : une bêta peut contenir le correctif d'un rapport,
  # écrit par claude -p d'après le message d'un joueur. Le propriétaire le relit avant de
  # lancer publier-beta.bat (fusion + tag, faille SG5) ; l'approbation ici est la seconde
  # vérification, juste avant que la clé soit donnée. Un
  # build.rs ou un script npm piégé pourrait voler la clé et signer de fausses mises à jour
  # acceptées par tous les launchers. Ce job déclare donc l'environnement GitHub « signature » :
  #   - les deux secrets TAURI_SIGNING_* sont rangés dans cet environnement, pas dans le dépôt ;
  #   - le job attend (statut « waiting ») que le propriétaire l'approuve dans l'onglet Actions
  #     (bouton « Review deployments ») ; avant, il ne voit pas les secrets ;
  #   - les tests (job « tests ») passent avant, sans clé ni approbation : on n'approuve
  #     qu'une version dont les tests sont verts. Une seule approbation libère les trois
  #     systèmes (Windows, Linux, Mac).
  # Approuver veut dire : « j'ai relu le diff depuis la version précédente et il ne contient
  # que ce que j'attends ». Ce qu'il faut regarder : docs/release.md, « Approuver la signature ».
  build:
    needs: create-release
    environment: signature
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branche stable (2026-11-24)
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      # Pas de cache Rust (Swatinem/rust-cache) dans ce job : le cache est rempli par d'autres
      # runs (CI des branches et de main, qui reçoit des fusions non relues) et il n'est pas
      # vérifié. Un cache piégé ferait tourner du code que l'approbation n'a pas vu, avec la
      # clé à portée. Prix : quelques minutes de compilation en plus. (Le cache npm, lui, est
      # vérifié par les empreintes de package-lock.json.)

      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libudev-dev pkg-config libxss-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxtst-dev libasound2-dev libpulse-dev libdrm-dev libgbm-dev
          # GStreamer embarqué dans l'AppImage (bundleMediaFramework) : sans lui,
          # celui du système, incompatible, fige le moteur web dès le premier son.
          # base : OGG/Vorbis (musiques) ; good : WAV (bruitages).
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - run: npm ci

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # FarfaLauncherDeck : le même moteur sans interface, pour le Steam Deck (onglet
  # Catalogue de NieRDeck, qui le télécharge depuis la dernière release).
  deck:
    needs: create-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branche stable (2026-11-24)

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: deck

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libudev-dev libdbus-1-dev libxss-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxtst-dev libasound2-dev libpulse-dev libdrm-dev libgbm-dev

      - name: Compiler
        working-directory: src-tauri
        run: cargo build --release --no-default-features --bin farfalauncherdeck

      - name: Joindre à la release
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.release_id),
              name: 'FarfaLauncherDeck-linux-x86_64',
              data: fs.readFileSync('src-tauri/target/release/farfalauncherdeck'),
              headers: { 'content-type': 'application/octet-stream' },
            });

  publish-release:
    needs: [create-release, build, deck]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publier la release
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            // Les .sig ne servent qu'au module de mise à jour, qui les lit déjà
            // dans latest.json : on ne garde que l'installateur, l'AppImage, le .dmg, l'archive .app.tar.gz (mise à jour Mac) et latest.json.
            const id = Number(process.env.release_id);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: id,
            });
            for (const a of assets) {
              if (a.name.endsWith('.sig')) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: a.id,
                });
              }
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: id,
              draft: false,
            });

            // Canal bêta : le latest.json de cette version (bêta ou stable) devient celui de
            // la release technique « canal-beta ».
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const latest = assets.find((a) => a.name === 'latest.json');
            if (!latest) {
              core.warning('Pas de latest.json dans la release : canal bêta inchangé.');
              return;
            }
            const { data: bytes } = await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', {
              owner,
              repo,
              asset_id: latest.id,
              headers: { accept: 'application/octet-stream' },
            });
            let beta;
            try {
              beta = (await github.rest.repos.getReleaseByTag({ owner, repo, tag: 'canal-beta' })).data;
            } catch (e) {
              beta = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: 'canal-beta',
                target_commitish: context.sha,
                name: 'Canal bêta (technique)',
                body: 'Release technique : son latest.json indique aux launchers du canal bêta (« Recevoir les versions de test ») la dernière version, de test ou stable. Rien à télécharger ici.',
                prerelease: true,
              })).data;
            }
            for (const a of beta.assets ?? []) {
              if (a.name === 'latest.json') {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
              }
            }
            // Les adresses de latest.json passent par « releases/latest/download », c'est-à-dire
            // la dernière version stable : pour une bêta, ses fichiers n'y sont pas (404). Le canal
            // bêta pointe donc sur la release de ce tag.
            const tag = context.ref.replace('refs/tags/', '');
            const manifest = JSON.parse(Buffer.from(bytes).toString('utf8'));
            for (const p of Object.values(manifest.platforms ?? {})) {
              if (typeof p.url === 'string') {
                p.url = p.url.replace('/releases/latest/download/', `/releases/download/${tag}/`);
              }
            }
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: beta.id,
              name: 'latest.json',
              data: Buffer.from(JSON.stringify(manifest, null, 2)),
              headers: { 'content-type': 'application/json' },
            });
            core.info(`Canal bêta : ${context.ref.replace('refs/tags/', '')}`);
