# Vérifications à chaque push sur main : types TypeScript, build de
# l'interface et tests Rust (Windows, plateforme prioritaire, et Linux).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libudev-dev pkg-config

      - run: npm ci
      - run: npx tsc --noEmit
      # Le build de l'interface est requis : Tauri l'embarque à la compilation.
      - run: npm run build
      - run: cargo test
        working-directory: src-tauri
