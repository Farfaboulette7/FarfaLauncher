# Version de test d'une correction, pour un seul joueur : à chaque tag test-<rapport>-<n>
# (poussé par la surveillance des rapports, outils/surveille-rapports), lance d'abord les tests
# (tests.yml, Windows et Linux), puis compile Windows et Linux (AppImage), signe les paquets et
# publie une pré-release avec son latest.json. Si un test échoue, rien n'est publié : le run
# finit en échec et la surveillance des rapports met le rapport « à décider ».
#
# Le joueur l'installe depuis la discussion de son signalement (« Installer la version de
# test », commands/update.rs : install_test_version). Elle garde le numéro de version du
# launcher dont elle part, et ne touche ni à la dernière release ni au canal bêta : la
# prochaine version publiée la remplace normalement.
#
# Ordre : tests (sans clé) → pré-release en brouillon → ATTENTE de l'approbation du
# propriétaire (environnement « signature ») → compilation signée → publication.
# Tant qu'il n'a pas approuvé, le run reste en statut « waiting » et rien n'est publié.
# S'il refuse (« Reject »), le run échoue et le brouillon reste invisible des joueurs.
#
# Secrets requis, dans l'environnement « signature » (Settings → Environments), PAS dans les
# secrets du dépôt : TAURI_SIGNING_PRIVATE_KEY et TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
name: Version de test

on:
  push:
    tags: ["test-*"]

# Par défaut, lecture seule ; seuls les jobs qui créent ou remplissent la release ont le droit
# d'écrire (contents: write), job par job.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Tests d'abord : tous les autres jobs en dépendent (needs), directement ou non.
  tests:
    uses: ./.github/workflows/tests.yml

  create-release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - name: Créer la pré-release (brouillon)
        id: create
        uses: actions/github-script@v9
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Version de test ${tag}`,
              body: 'Version de test d\'une correction, pour le joueur qui a signalé le problème. Elle s\'installe depuis la discussion du signalement dans le launcher.',
              draft: true,
              prerelease: true,
              make_latest: 'false',
            });
            return data.id;

  # Compilation et signature : SEUL job de ce workflow qui reçoit la clé de signature.
  #
  # Approbation obligatoire (faille SG3) : le code compilé ici a été écrit par le support
  # automatique (claude -p) d'après le rapport d'un joueur, et personne ne l'a relu. Un
  # build.rs ou un script npm piégé pourrait voler la clé et signer de fausses mises à jour
  # acceptées par tous les launchers. Ce job déclare donc l'environnement GitHub « signature » :
  #   - les deux secrets TAURI_SIGNING_* sont rangés dans cet environnement, pas dans le dépôt ;
  #   - le job attend (statut « waiting ») que le propriétaire l'approuve dans l'onglet Actions
  #     (bouton « Review deployments ») ; avant, il ne voit pas les secrets ;
  #   - les tests (job « tests ») passent avant, sans clé ni approbation : on n'approuve
  #     qu'une version dont les tests sont verts.
  # Approuver veut dire : « j'ai relu le diff de ce commit et il ne fait que la correction
  # annoncée ». Ce qu'il faut regarder : docs/release.md, « Approuver la signature ».
  build:
    needs: create-release
    environment: signature
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branche stable (2026-11-24)

      # Pas de cache Rust (Swatinem/rust-cache) dans ce job : le cache est rempli par d'autres
      # runs (CI de main, qui reçoit des fusions non relues) et il n'est pas vérifié. Un cache
      # piégé ferait tourner du code que l'approbation n'a pas vu, avec la clé à portée.
      # Prix : quelques minutes de compilation en plus. (Le cache npm, lui, est vérifié par les
      # empreintes de package-lock.json.)

      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libudev-dev pkg-config libxss-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxtst-dev libasound2-dev libpulse-dev libdrm-dev libgbm-dev
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - run: npm ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publier la pré-release
        uses: actions/github-script@v9
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const id = Number(process.env.release_id);
            const tag = context.ref.replace('refs/tags/', '');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id: id });
            for (const a of assets) {
              if (a.name.endsWith('.sig')) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
              }
            }
            // latest.json : les adresses doivent viser cette release, pas « releases/latest ».
            const latest = assets.find((a) => a.name === 'latest.json');
            if (latest) {
              const { data: bytes } = await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', {
                owner, repo, asset_id: latest.id, headers: { accept: 'application/octet-stream' },
              });
              const manifest = JSON.parse(Buffer.from(bytes).toString('utf8'));
              for (const p of Object.values(manifest.platforms ?? {})) {
                if (typeof p.url === 'string') {
                  p.url = p.url.replace('/releases/latest/download/', `/releases/download/${tag}/`);
                }
              }
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: latest.id });
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: id, name: 'latest.json',
                data: Buffer.from(JSON.stringify(manifest, null, 2)),
                headers: { 'content-type': 'application/json' },
              });
            } else {
              core.setFailed('Pas de latest.json : la version de test ne pourra pas s\'installer depuis le launcher.');
            }
            await github.rest.repos.updateRelease({ owner, repo, release_id: id, draft: false, make_latest: 'false' });
