[package]
name = "farfalauncher"
version = "0.4.3"
description = "Launcher de jeux recomp / portages PC hébergés sur un serveur RomM"
authors = ["Farfaboulette7"]
repository = "https://github.com/Farfaboulette7/FarfaLauncher"
edition = "2021"

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "farfalauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2", "multipart"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
url = "2"
psl = "2"
sha1 = "0.10"
md-5 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz", "zstd", "time"] }
tar = "0.4"
flate2 = "1"
fs4 = "1"
tokio-util = "0.7"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }

# Manettes sous Linux et macOS (sous Windows : XInput, voir src/gamepad.rs).
[target."cfg(not(windows))".dependencies]
gilrs = "0.11"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_XboxController"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Bibliothèques optimisées même en développement (hachage, décompression).
[profile.dev.package."*"]
opt-level = 3
